<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionnaire de mots de passe</title>
  <link rel="stylesheet" href="passwords-popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="arrow-up"></div>

    <header class="popup-header">
      <div class="header-left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <h2 class="title">MOTS DE PASSE • COFFRE-FORT</h2>
      </div>
      <button id="btn-toggle-add-form" class="btn-add-primary">+ Ajouter</button>
    </header>

    <!-- Add Form Modal / Drawer -->
    <div id="add-form-container" class="add-form-box hidden">
      <span class="form-title">Enregistrer un identifiant</span>
      <input type="text" id="input-site" placeholder="Site web (ex: netflix.com)" />
      <input type="text" id="input-username" placeholder="Identifiant ou email" />
      <div class="pass-input-row">
        <input type="password" id="input-password" placeholder="Mot de passe" />
        <button id="btn-gen-pass" class="btn-gen" title="Générer un mot de passe fort">🎲 Générer</button>
      </div>
      <div class="form-actions-row">
        <button id="btn-cancel-add" class="btn-secondary-sm">Annuler</button>
        <button id="btn-save-pass" class="btn-primary-sm">Enregistrer</button>
      </div>
    </div>

    <!-- Search bar -->
    <div class="search-bar-wrap">
      <input type="text" id="search-pass" placeholder="Rechercher un compte ou un site..." />
    </div>

    <!-- Passwords List -->
    <div class="popup-scroll-body" id="passwords-list">
      <!-- Injected by JS -->
    </div>
  </div>

  <script src="passwords-popup.js"></script>
</body>
</html>
