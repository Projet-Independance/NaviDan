<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionnaire de thèmes</title>
  <link rel="stylesheet" href="themes-popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="arrow-up"></div>

    <header class="popup-header">
      <div class="header-left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
          <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
          <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
          <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
        </svg>
        <h2 class="title">THÈMES &amp; COULEURS</h2>
      </div>
    </header>

    <div class="popup-scroll-body">
      <!-- Preset Themes Section -->
      <span class="section-title">THÈMES PRÉDÉFINIS</span>
      <div class="themes-grid">
        <div class="theme-card" data-preset="cyber-dark">
          <div class="theme-preview-box cyber-dark-prev"></div>
          <span class="theme-name">Cyber Dark</span>
        </div>

        <div class="theme-card" data-preset="tokyo-night">
          <div class="theme-preview-box tokyo-night-prev"></div>
          <span class="theme-name">Tokyo Night</span>
        </div>

        <div class="theme-card" data-preset="ocean-blue">
          <div class="theme-preview-box ocean-blue-prev"></div>
          <span class="theme-name">Océan Abyssal</span>
        </div>

        <div class="theme-card" data-preset="matrix-green">
          <div class="theme-preview-box matrix-green-prev"></div>
          <span class="theme-name">Matrix Hacker</span>
        </div>

        <div class="theme-card" data-preset="light">
          <div class="theme-preview-box light-prev"></div>
          <span class="theme-name">Clair Épuré</span>
        </div>
      </div>

      <!-- Accent Color Selection -->
      <span class="section-title">COULEUR NÉON D'ACCENT</span>
      <div class="accents-row">
        <button class="accent-circle" data-color="#3b82f6" style="background: #3b82f6;" title="Bleu Électrique"></button>
        <button class="accent-circle" data-color="#ff0055" style="background: #ff0055;" title="Rouge Cyber Néon"></button>
        <button class="accent-circle" data-color="#a855f7" style="background: #a855f7;" title="Violet Tokyo"></button>
        <button class="accent-circle" data-color="#10b981" style="background: #10b981;" title="Vert Matrix"></button>
        <button class="accent-circle" data-color="#06b6d4" style="background: #06b6d4;" title="Cyan Cyberpunk"></button>
        <button class="accent-circle" data-color="#f59e0b" style="background: #f59e0b;" title="Ambre Sunset"></button>
      </div>
    </div>
  </div>

  <script src="themes-popup.js"></script>
</body>
</html>
