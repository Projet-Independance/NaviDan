<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Téléchargements</title>
  <link rel="stylesheet" href="downloads-popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Top Caret / Arrow pointer -->
    <div class="arrow-up"></div>

    <!-- Header -->
    <header class="popup-header">
      <div class="header-left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <h2 class="title">Téléchargements</h2>
      </div>
      <div class="header-actions">
        <button id="btn-open-folder" class="icon-btn" title="Ouvrir le dossier Téléchargements">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
        <button id="btn-clear-downloads" class="icon-btn" title="Vider la liste">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Body / List -->
    <div class="popup-body" id="downloads-list">
      <!-- Items dynamically injected -->
      <div class="empty-state">
        <span class="empty-icon">📥</span>
        <span>Aucun téléchargement récent</span>
      </div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <button id="btn-footer-folder" class="footer-btn">
        Afficher tous les téléchargements
      </button>
    </footer>
  </div>

  <script src="downloads-popup.js"></script>
</body>
</html>
