<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favoris</title>
  <link rel="stylesheet" href="popups-common.css">
</head>
<body class="no-arrow">
  <div class="popup-container">
    <div class="arrow-up"></div>

    <header class="popup-header">
      <div class="header-left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
        </svg>
        <h2 class="title">Favoris</h2>
      </div>
      <div class="header-actions">
        <button id="btn-add-bookmark" class="icon-btn-danger" style="background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.3); color: #60a5fa;" title="Ajouter cette page aux favoris">
          + Ajouter cette page
        </button>
      </div>
    </header>

    <div class="popup-body" id="bookmarks-list">
      <!-- Items dynamically populated -->
    </div>
  </div>

  <script src="bookmarks-popup.js"></script>
</body>
</html>
