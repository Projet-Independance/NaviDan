<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Outer Chamfered Technical Plate -->
  <polygon points="72,32 440,32 480,72 480,440 440,480 72,480 32,440 32,72" fill="#0d1117" stroke="#30363d" stroke-width="4"/>

  <!-- Inner Hairline Guide -->
  <polygon points="80,44 432,44 468,80 468,432 432,468 80,468 44,432 44,80" fill="none" stroke="#21262d" stroke-width="1.5"/>

  <!-- Precision Dial Circles -->
  <circle cx="256" cy="256" r="164" fill="none" stroke="#21262d" stroke-width="2"/>
  <circle cx="256" cy="256" r="136" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3,7"/>

  <!-- Cardinal Tick Marks -->
  <line x1="256" y1="84" x2="256" y2="104" stroke="#2563eb" stroke-width="3"/>
  <line x1="256" y1="408" x2="256" y2="428" stroke="#30363d" stroke-width="2"/>
  <line x1="84" y1="256" x2="104" y2="256" stroke="#30363d" stroke-width="2"/>
  <line x1="408" y1="256" x2="428" y2="256" stroke="#30363d" stroke-width="2"/>

  <!-- 45-degree ticks -->
  <line x1="135" y1="135" x2="149" y2="149" stroke="#30363d" stroke-width="1.5"/>
  <line x1="377" y1="135" x2="363" y2="149" stroke="#2563eb" stroke-width="2"/>
  <line x1="135" y1="377" x2="149" y2="363" stroke="#30363d" stroke-width="1.5"/>
  <line x1="377" y1="377" x2="363" y2="363" stroke="#30363d" stroke-width="1.5"/>

  <!-- Crosshair Reticle -->
  <line x1="120" y1="256" x2="216" y2="256" stroke="#21262d" stroke-width="2"/>
  <line x1="296" y1="256" x2="392" y2="256" stroke="#21262d" stroke-width="2"/>
  <line x1="256" y1="120" x2="256" y2="216" stroke="#21262d" stroke-width="2"/>
  <line x1="256" y1="296" x2="256" y2="392" stroke="#21262d" stroke-width="2"/>

  <!-- Faceted Compass Needle (Pointing North-East / Vector) -->
  <!-- NE Light Facet -->
  <polygon points="256,256 233,233 368,144" fill="#3b82f6"/>
  <!-- NE Deep Facet -->
  <polygon points="256,256 279,279 368,144" fill="#1d4ed8"/>
  <!-- SW White Facet -->
  <polygon points="256,256 233,233 168,344" fill="#f0f6fc"/>
  <!-- SW Grey Facet -->
  <polygon points="256,256 279,279 168,344" fill="#64748b"/>

  <!-- Needle Center Hub -->
  <circle cx="256" cy="256" r="16" fill="#0d1117" stroke="#f0f6fc" stroke-width="3"/>
  <circle cx="256" cy="256" r="6" fill="#2563eb"/>

  <!-- Technical Cardinal Marker 'N' -->
  <text x="256" y="68" fill="#3b82f6" font-family="ui-monospace, 'SF Mono', monospace" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1">N</text>

  <!-- Technical Identifier -->
  <text x="256" y="456" fill="#64748b" font-family="ui-monospace, 'SF Mono', monospace" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="5">NAVIDAN</text>
</svg>
